<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Caderno do Parque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: uma pergunta por vez numa folha estreita; barra de progresso em cima; navegação embaixo; índice dobrável. */
:root {
  --bg: #eef2ec;
  --page: #f8faf6;
  --ink: #1d2620;
  --muted: #5b6a5f;
  --line: #cfd9cf;
  --moss: #3d6a4c;
  --moss-ink: #ffffff;
  --moss-soft: #dde8de;
  --sun: #8a6a1f;
  --sun-soft: #f1e9d2;
  --rec: #b3361f;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121814; --page: #182019; --ink: #e3ebe4; --muted: #9db0a2; --line: #2c3a30;
    --moss: #8cc39d; --moss-ink: #10180f; --moss-soft: #1f3125; --sun: #e0bf6e; --sun-soft: #2e2817;
    --rec: #ff8a73; color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.0625rem;
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(1.5rem, env(safe-area-inset-top, 0px)) max(3rem, env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }
.folha { max-width: 38rem; margin: 0 auto; display: grid; gap: 1.5rem; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; line-height: 1.25; margin: 0; }
h2 { font-size: clamp(1.35rem, 4.6vw, 1.7rem); }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.rotulo { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--moss); font-weight: 700; }
.muted { color: var(--muted); }

.topo { display: grid; gap: 0.5rem; }
.topo-linha { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.contador { font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.barra { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.barra > span { display: block; height: 100%; background: var(--moss); width: 0; transition: width .3s ease; }

.cartao {
  background: var(--page);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1.5rem 1.4rem;
  display: grid; gap: 1rem;
}
.cartao.visual { background: var(--moss-soft); border-color: transparent; }
.cartao.fim { background: var(--sun-soft); border-color: transparent; }
.nota { color: var(--muted); font-size: 0.95rem; }
.citacao { border-left: 3px solid var(--sun); padding-left: 0.9rem; font-style: italic; color: var(--muted); }
.cartao ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.35rem; }

.campo { display: grid; gap: 0.6rem; }
.campo > label { font-weight: 700; font-size: 0.95rem; }
textarea {
  width: 100%; min-height: 9rem; resize: vertical;
  font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 0.8rem 0.9rem;
}
textarea:focus-visible, button:focus-visible, input:focus-visible + span { outline: 3px solid var(--moss); outline-offset: 2px; }
.dica { font-size: 0.88rem; color: var(--muted); }
.salvo { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }

button {
  font: inherit; font-weight: 700; cursor: pointer;
  border-radius: 10px; padding: 0.75rem 1.2rem; border: 1px solid var(--line);
  background: var(--page); color: var(--ink);
}
button.principal { background: var(--moss); color: var(--moss-ink); border-color: var(--moss); }
button:disabled { opacity: 0.55; cursor: default; }
.navegacao { display: flex; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
.navegacao .principal { margin-left: auto; }

.mic-linha { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
button.mic {
  display: inline-flex; align-items: center; gap: 0.55rem;
  padding: 0.85rem 1.3rem; border-radius: 99px;
  background: var(--moss); color: var(--moss-ink); border-color: var(--moss);
}
button.mic svg { width: 1.2rem; height: 1.2rem; flex: none; }
button.mic.gravando { background: var(--rec); border-color: var(--rec); color: #fff; }
button.mic.gravando .ponto { animation: pulsa 1s ease-in-out infinite; }
@keyframes pulsa { 50% { opacity: 0.3; } }
.parcial { font-style: italic; color: var(--muted); font-size: 0.95rem; min-height: 1.2em; }

.timer { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.timer output { font-family: var(--display); font-size: 1.8rem; font-variant-numeric: tabular-nums; }

.grade-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 30rem; font-size: 0.92rem; }
th, td { padding: 0.55rem 0.4rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.notas { display: flex; gap: 0.2rem; }
.notas label { position: relative; }
.notas input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.notas span {
  display: inline-grid; place-items: center; width: 1.7rem; height: 1.7rem; border-radius: 50%;
  border: 1px solid var(--line); font-size: 0.85rem; cursor: pointer; font-variant-numeric: tabular-nums;
}
.notas input:checked + span { background: var(--moss); color: var(--moss-ink); border-color: var(--moss); }
.peso { display: flex; align-items: center; gap: 0.35rem; font-size: 0.85rem; white-space: nowrap; }

details.indice { background: var(--page); border: 1px solid var(--line); border-radius: 12px; padding: 0.8rem 1rem; }
details.indice summary { cursor: pointer; font-weight: 700; }
.indice ol { list-style: none; margin: 0.8rem 0 0; padding: 0; display: grid; gap: 0.15rem; max-height: 22rem; overflow-y: auto; }
.indice button {
  width: 100%; text-align: left; font-weight: 400; border: 0; background: none; padding: 0.4rem 0.3rem;
  display: grid; grid-template-columns: 1.4rem 1fr; gap: 0.4rem; border-radius: 6px;
}
.indice button[aria-current="true"] { background: var(--moss-soft); }
.indice .marca { color: var(--moss); font-weight: 700; }
.indice .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#tudo { min-height: 12rem; font-size: 0.85rem; }
@media (prefers-reduced-motion: reduce) { .barra > span { transition: none; } button.mic.gravando .ponto { animation: none; } }
</style>
</head>
<body>
<main class="folha">
  <header class="topo">
    <div class="topo-linha">
      <span class="rotulo" id="secao">Caderno do Parque</span>
      <span class="contador" id="contador"></span>
    </div>
    <div class="barra" aria-hidden="true"><span id="progresso"></span></div>
  </header>

  <div id="tela"></div>

  <details class="indice" id="indice">
    <summary>Todas as perguntas</summary>
    <ol id="lista"></ol>
  </details>
</main>

<script>
const CAMINHADAS = {
  1: "Caminhada 1 · O que eu sinto",
  2: "Caminhada 2 · O que eu sei",
  3: "Caminhada 3 · O que eu vou testar",

const STEPS = [
  { id: "v1", c: 1, tipo: "visual", minutos: 5, titulo: "Uma terça-feira comum, daqui a um ano",
    texto: "Não um dia de conquista. Uma terça qualquer, com a vida já do jeito que você quer. Comece pelo acordar e vá devagar.",
    itens: ["Onde você acorda? O que vê pela janela? Que barulho tem lá fora?", "Está sozinho ou com alguém?", "Qual a primeira conversa de trabalho do dia, e com quem?", "Onde você trabalha: casa, escritório, café? Tem gente em volta?", "O que você faz no fim da tarde?", "Quando foi a última vez que viu sua família?"] },
  { id: "p01", c: 1, texto: "Descreva a terça-feira que você imaginou, do acordar ao dormir." },
  { id: "p02", c: 1, texto: "Em que cidade ela aconteceu? Você escolheu a cidade ou ela apareceu sozinha?", nota: "Se apareceu sozinha, preste atenção nela." },
  { id: "p03", c: 1, texto: "Qual momento desse dia te deu mais vontade de que fosse verdade?" },
  { id: "p04", c: 1, texto: "Teve algum momento do dia que pareceu obrigação, e não vontade?" },

  { id: "p06", c: 1, texto: "O que você NÃO quer de jeito nenhum no ano que vem? Diga pelo menos cinco coisas." },
  { id: "v2", c: 1, tipo: "visual", minutos: 5, titulo: "Você aos 25 anos",
    texto: "Imagine você com 25 anos sentado no banco ao lado. Ele te pergunta como está a vida. Ouça o que ele queria naquela época: viajar para fora, Europa, talvez morar em Florianópolis." },
  { id: "p07", c: 1, texto: "O que ele queria? Faça a lista dele, nas palavras dele." },
  { id: "p08", c: 1, texto: "Desses desejos, quais ainda dão um aperto bom no peito quando você pensa neles?" },
  { id: "p09", c: 1, texto: "Quais eram vontade de verdade e quais eram imagem, coisa que parecia bonita de querer?" },
  { id: "p10", c: 1, texto: "O que ele acharia da sua vida hoje? Do que ele teria orgulho? O que ele estranharia?" },
  { id: "p11", c: 1, texto: "O que você diria para ele sobre o que aprendeu desde então?" },
  { id: "p12", c: 1, texto: "Algum desses desejos você abandonou por escolha, ou ele só foi ficando para depois?" },

  { id: "p13", c: 2, tema: "A solidão", citacao: "A maior dor que eu tenho é não conseguir encontrar pessoas que entendam o que eu quero construir e estejam dispostas a construir junto.",
    texto: "Lembre da última vez em que você se sentiu entendido sobre o que está construindo. Com quem foi, onde, e o que essa pessoa disse?" },
  { id: "p14", c: 2, tema: "A solidão", texto: "Do que exatamente você sente falta: de alguém para pensar junto, para executar, para dividir o risco, ou de alguém que admire o que você faz?", nota: "Podem ser várias, mas tente pôr em ordem." },
  { id: "p15", c: 2, tema: "A solidão", texto: "Essas pessoas precisam estar na mesma cidade que você, ou precisam estar no mesmo momento que você?" },
  { id: "p16", c: 2, tema: "A solidão", texto: "Quantas pessoas, nome por nome, você conhece hoje que estão perto de entender o que você constrói? O que impede de chamar uma delas para um café ou uma call esta semana?" },
  { id: "p17", c: 2, tema: "A solidão", texto: "Quando você trabalhou em equipe no passado, o que fazia aquilo ser bom? Era o lugar, as pessoas, o projeto ou o ritmo?" },
  { id: "p18", c: 2, tema: "A solidão", texto: "Se a solidão sumisse amanhã, o que mudaria primeiro no seu negócio?" },
  { id: "p19", c: 2, tema: "São Paulo e Alphaville", texto: "O que você imagina que existe em São Paulo e não existe onde você mora hoje? Diga o que é fato e o que é suposição." },
  { id: "p20", c: 2, tema: "São Paulo e Alphaville", texto: "Quando você pensa em ir para São Paulo, é para ganhar algo ou para fugir de algo?" },
  { id: "p21", c: 2, tema: "São Paulo e Alphaville", texto: "Se você fosse para lá, quem seriam as três primeiras pessoas que você procuraria? Você já tem como falar com elas daqui?" },
  { id: "p22", c: 2, tema: "São Paulo e Alphaville", texto: "O menino que queria ir nos grandes eventos do digital ainda quer pertencer àquele ecossistema? Ou hoje você quer construir um ecossistema seu?" },
  { id: "p23", c: 2, tema: "São Paulo e Alphaville", texto: "O que te faria sentir que mudar para São Paulo foi um erro, mesmo se o negócio crescesse?" },
  { id: "p24", c: 2, tema: "São Paulo e Alphaville", texto: "Existe um meio-termo, como morar em um lugar e passar uma semana por mês em outro? Como ele seria na prática?" },
  { id: "v3", c: 2, tipo: "visual", minutos: 9, titulo: "A mesma terça-feira em três lugares",
    texto: "Repita a terça-feira da primeira caminhada, igual em tudo, mudando só a cidade. Uns 3 minutos para cada cena. Depois de cada uma, repare no que sentiu no corpo: aperto, leveza, ansiedade, vontade.",
    itens: ["Cena A: São Paulo ou Alphaville, apartamento simples, perto dos eventos e das empresas.", "Cena B: Florianópolis, apartamento simples, trabalho remoto e viagens a São Paulo.", "Cena C: Porto Alegre, perto da família, com viagens marcadas para São Paulo e para fora."] },
  { id: "grade", c: 2, tipo: "grade", titulo: "Dê uma nota de 1 a 5 para cada lugar",
    texto: "Depois marque as duas linhas que mais pesam para você. Elas importam mais que a soma." },
  { id: "p25", c: 2, tema: "O dinheiro e o caminho solo", texto: "\"Negócio rodando\" quer dizer quanto por mês, em reais? Qual é o mínimo para você parar de se preocupar?" },
  { id: "p26", c: 2, tema: "O dinheiro e o caminho solo", texto: "Qual seria o negócio solo que te daria esse dinheiro sem depender de ninguém? Ele já existe dentro do que você faz hoje?" },
  { id: "p27", c: 2, tema: "O dinheiro e o caminho solo", texto: "Esse negócio solo é uma ponte para contratar as pessoas certas, ou ele vira o destino? Como você vai saber a diferença?" },
  { id: "p28", c: 2, tema: "O dinheiro e o caminho solo", texto: "Quando você pensa em contratar, qual é a primeira pessoa e o que ela tiraria das suas costas?" },
  { id: "p29", c: 2, tema: "O dinheiro e o caminho solo", texto: "A frase \"o capitalismo nos joga para abandonar nossas vontades\": em que parte da sua vida isso é verdade, e em que parte é uma história que te protege de escolher?" },
  { id: "p30", c: 2, tema: "O dinheiro e o caminho solo", texto: "Existe um jeito de ganhar dinheiro em que as vontades de você aos 25 anos fazem parte do plano, e não ficam para depois?" },
  { id: "p31", c: 2, tema: "Casa, família e liberdade", texto: "O apartamento simples, sem aluguel, é sobre dinheiro, sobre segurança ou sobre ter um lugar seu? O que muda dependendo da resposta?" },
  { id: "p32", c: 2, tema: "Casa, família e liberdade", texto: "Comprar um apartamento te prende a uma cidade. Você está pronto para escolher a cidade agora, ou isso vem depois de testar?" },
  { id: "p33", c: 2, tema: "Casa, família e liberdade", texto: "De quanto em quanto tempo você quer ver sua família para se sentir bem?" },
  { id: "p34", c: 2, tema: "Casa, família e liberdade", texto: "Liberdade, para você hoje, é tempo, lugar, dinheiro ou não ter que pedir permissão?" },
  { id: "p35", c: 2, tema: "Casa, família e liberdade", texto: "Qual viagem para fora, concreta, com destino e mês, você quer fazer até outubro de 2027?" },

  { id: "p36", c: 3, texto: "Qual evento em São Paulo ou Alphaville, ainda este ano, você vai? Diga o nome, a data e quanto custa ir.",
    nota: "Se você não consegue se imaginar num lugar onde nunca foi, a resposta depende de um teste, não de mais pensamento." },
  { id: "p37", c: 3, texto: "Lá, o que você vai observar?", nota: "Sugestão: com quantas pessoas conversei que entenderam o que eu construo em menos de dois minutos; quem eu quero rever; como me senti andando pelo bairro à noite." },
  { id: "p38", c: 3, texto: "Que resultado do evento te faria pensar \"é aqui\"? E qual te faria pensar \"não é para mim\"?" },
  { id: "p39", c: 3, texto: "Antes de mudar de cidade, que teste menor você pode fazer? Uma semana em Florianópolis, um mês em São Paulo, três calls por semana com gente de lá?" },
  { id: "p40", c: 3, texto: "Que decisão você pode tomar já, que serve para qualquer uma das cidades?" },
  { id: "p41", c: 3, texto: "Que decisão você vai deixar para depois do teste, sem culpa?" },

  { id: "frase", c: 4, texto: "Complete em uma frase: \"Em outubro de 2027 eu quero estar ___, com ___, fazendo ___.\"" },
  { id: "passo", c: 4, texto: "Qual é o primeiro passo desta semana, pequeno o bastante para fazer amanhã?" },
];

const CRITERIOS = [
  ["pessoas", "Pessoas que entendem o que eu construo"],
  ["socios", "Chance de achar sócio, investidor e equipe"],
  ["custo", "Custo de vida e paz com o aluguel"],
  ["vida", "Qualidade de vida e liberdade"],
  ["familia", "Perto da família"],
  ["corpo", "O que o corpo sentiu na visualização"],
];
const LUGARES = [["sp", "São Paulo"], ["fl", "Floripa"], ["poa", "POA + viagens"]];

/* ---------- estado (fica só neste celular) ---------- */
const LOCAL = "caderno-do-parque-v1";
let respostas = {};
let atual = 0;
let timerAtivo = null;

function carregar() {
  try { const t = localStorage.getItem(LOCAL); if (t) { const d = JSON.parse(t); respostas = d.respostas || {}; atual = d.atual || 0; } } catch {}
}
function gravar() {
  try { localStorage.setItem(LOCAL, JSON.stringify({ respostas, atual })); setStatus("Salvo neste celular."); }
  catch { setStatus("Não consegui salvar. Seu navegador pode estar em modo anônimo."); }
}
function setStatus(txt) { const el = document.getElementById("salvo"); if (el) el.textContent = txt; }

function respondida(step) {
  const r = respostas[step.id];
  if (!r) return false;
  if (step.tipo === "grade") return r.notas && Object.keys(r.notas).length > 0;
  return !!(r.texto && r.texto.trim());
}

/* ---------- ditado por voz ---------- */
const Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recStep = null, recDesligando = false;

function iconeMic() {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("aria-hidden", "true");
  svg.innerHTML = '<rect class="ponto" x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>';
  return svg;
}

function alternarDitado(step, ta, botao, parcial) {
  if (rec && recStep === step.id) { pararDitado(); return; }
  pararDitado();
  rec = new Reconhecimento();
  rec.lang = "pt-BR";
  rec.continuous = true;
  rec.interimResults = true;
  recStep = step.id; recDesligando = false;

  rec.onresult = (ev) => {
    let provisorio = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const trecho = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) {
        const base = ta.value.trim();
        const limpo = trecho.trim();
        if (limpo) {
          const frase = limpo.charAt(0).toUpperCase() + limpo.slice(1);
          ta.value = base ? `${base} ${frase}` : frase;
          if (!/[.!?]$/.test(ta.value)) ta.value += ".";
          respostas[step.id] = { ...(respostas[step.id] || {}), texto: ta.value };
          gravar(); atualizarTopo();
        }
      } else provisorio += trecho;
    }
    parcial.textContent = provisorio;
  };
  rec.onerror = (ev) => {
    const msg = {
      "not-allowed": "O navegador bloqueou o microfone. Libere o microfone para este site nas configurações do navegador.",
      "service-not-allowed": "O navegador bloqueou o ditado. Libere o microfone para este site nas configurações.",
      "no-speech": "Não ouvi nada. Toque de novo e fale.",
      "network": "O ditado precisa de internet. Confira o sinal e tente de novo.",
      "audio-capture": "Não achei um microfone neste aparelho.",
    }[ev.error];
    if (msg) setStatus(msg);
  };
  rec.onend = () => {
    // O Chrome encerra sozinho depois de um silêncio; enquanto o botão estiver ligado, continua ouvindo.
    if (!recDesligando && recStep === step.id) { try { rec.start(); return; } catch {} }
    parcial.textContent = "";
    botao.classList.remove("gravando");
    botao.lastChild.textContent = "Falar";
    if (recStep === step.id) { rec = null; recStep = null; }
  };
  try {
    rec.start();
    botao.classList.add("gravando");
    botao.lastChild.textContent = "Parar";
    setStatus("Ouvindo… fale à vontade. Toque em Parar quando terminar.");
  } catch { setStatus("Não consegui ligar o microfone. Tente de novo."); }
}
function pararDitado() {
  if (!rec) return;
  recDesligando = true;
  try { rec.stop(); } catch {}
}

/* ---------- navegação ---------- */
function ir(i) {
  pararDitado();
  pararTimer();
  atual = Math.max(0, Math.min(STEPS.length, i));
  gravar();
  render();
  window.scrollTo({ top: 0 });
}

/* ---------- render ---------- */
function el(tag, attrs = {}, ...filhos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const f of filhos) if (f != null) e.append(f);
  return e;
}

function atualizarTopo() {
  const total = STEPS.length;
  const feitas = STEPS.filter(respondida).length;
  document.getElementById("progresso").style.width = Math.round((feitas / total) * 100) + "%";
  document.getElementById("contador").textContent = `${feitas} de ${total} respondidas`;
  return feitas;
}

function render() {
  const feitas = atualizarTopo();
  const tela = document.getElementById("tela");
  tela.replaceChildren();
  if (atual >= STEPS.length) {
    document.getElementById("secao").textContent = "Fim";
    tela.append(telaFim(feitas));
  } else {
    const step = STEPS[atual];
    document.getElementById("secao").textContent = CAMINHADAS[step.c];
    tela.append(step.tipo === "visual" ? telaVisual(step) : step.tipo === "grade" ? telaGrade(step) : telaPergunta(step));
  }
  renderIndice();
}

let debounce = null;
function campoTexto(step, rotulo) {
  const id = "resposta-" + step.id;
  const ta = el("textarea", { id, rows: "6", placeholder: "Toque em Falar ou escreva aqui…" });
  ta.value = respostas[step.id]?.texto || "";
  ta.addEventListener("input", () => {
    respostas[step.id] = { ...(respostas[step.id] || {}), texto: ta.value };
    clearTimeout(debounce);
    debounce = setTimeout(() => { gravar(); atualizarTopo(); }, 600);
  });
  const parcial = el("p", { class: "parcial", "aria-live": "polite" });
  let micLinha;
  if (Reconhecimento) {
    const botao = el("button", { type: "button", class: "mic" }, iconeMic(), el("span", { text: "Falar" }));
    botao.addEventListener("click", () => alternarDitado(step, ta, botao, parcial));
    micLinha = el("div", { class: "mic-linha" }, botao, el("span", { class: "dica", text: "O que você falar vira texto aqui. Dá para corrigir digitando." }));
  } else {
    micLinha = el("p", { class: "dica", text: "Este navegador não tem ditado. Abra no Chrome, ou use o microfone do teclado do celular." });
  }
  return el("div", { class: "campo" }, el("label", { for: id, text: rotulo }), micLinha, parcial, ta);
}

function navegacao() {
  const ultimo = atual === STEPS.length - 1;
  return el("div", { class: "navegacao" },
    el("button", { type: "button", text: "Pular", onclick: () => ir(atual + 1) }),
    el("button", { type: "button", class: "principal", text: ultimo ? "Terminar" : "Próxima", onclick: () => ir(atual + 1) }));
}

function telaPergunta(step) {
  const n = STEPS.slice(0, atual + 1).filter(s => !s.tipo).length;
  return el("article", { class: "cartao" },
    step.tema ? el("span", { class: "rotulo", text: step.tema }) : null,
    step.citacao ? el("p", { class: "citacao", text: "\"" + step.citacao + "\"" }) : null,
    el("h2", { text: step.texto }),
    step.nota ? el("p", { class: "nota", text: step.nota }) : null,
    campoTexto(step, step.id.startsWith("p") ? `Sua resposta · pergunta ${n} de 41` : "Sua resposta"),
    el("p", { class: "salvo", id: "salvo" }),
    navegacao());
}

function telaVisual(step) {
  const out = el("output", { id: "relogio", text: fmt(step.minutos * 60) });
  const btn = el("button", { type: "button", class: "principal", id: "btn-timer", text: `Começar ${step.minutos} min de olhos fechados` });
  btn.addEventListener("click", () => timerAtivo ? pararTimer() : iniciarTimer(step.minutos * 60));
  return el("article", { class: "cartao visual" },
    el("span", { class: "rotulo", text: `Visualização · ${step.minutos} minutos` }),
    el("h2", { text: step.titulo }),
    el("p", { text: step.texto }),
    step.itens ? el("ul", {}, ...step.itens.map(t => el("li", { text: t }))) : null,
    el("div", { class: "timer" }, btn, out),
    el("p", { class: "dica", text: "O celular apita e vibra quando o tempo acabar." }),
    campoTexto(step, "O que você viu e sentiu"),
    el("p", { class: "salvo", id: "salvo" }),
    navegacao());
}

function telaGrade(step) {
  const r = respostas.grade || { notas: {}, pesos: [] };
  respostas.grade = r;
  r.notas = r.notas || {}; r.pesos = r.pesos || [];
  const corpo = el("tbody");
  for (const [cid, nome] of CRITERIOS) {
    const tr = el("tr", {}, el("td", { text: nome }));
    for (const [lid, lnome] of LUGARES) {
      const grupo = el("div", { class: "notas", role: "radiogroup", "aria-label": `${nome}, ${lnome}` });
      for (let v = 1; v <= 5; v++) {
        const inp = el("input", { type: "radio", name: `g-${cid}-${lid}`, id: `g-${cid}-${lid}-${v}`, value: String(v) });
        if (r.notas[cid]?.[lid] === v) inp.checked = true;
        inp.addEventListener("change", () => { r.notas[cid] = { ...(r.notas[cid] || {}), [lid]: v }; gravar(); atualizarTopo(); renderIndice(); });
        grupo.append(el("label", { for: inp.id }, inp, el("span", { text: String(v) })));
      }
      tr.append(el("td", {}, grupo));
    }
    const peso = el("input", { type: "checkbox", id: `peso-${cid}` });
    peso.checked = r.pesos.includes(cid);
    peso.addEventListener("change", () => {
      r.pesos = peso.checked ? [...r.pesos.filter(p => p !== cid), cid].slice(-2) : r.pesos.filter(p => p !== cid);
      gravar(); render();
    });
    tr.append(el("td", {}, el("label", { class: "peso", for: peso.id }, peso, "pesa mais")));
    corpo.append(tr);
  }
  const head = el("thead", {}, el("tr", {}, el("th", { text: "Critério" }), ...LUGARES.map(([, n]) => el("th", { text: n })), el("th", { text: "" })));
  return el("article", { class: "cartao" },
    el("h2", { text: step.titulo }),
    el("p", { class: "nota", text: step.texto }),
    el("div", { class: "grade-wrap" }, el("table", {}, head, corpo)),
    el("p", { class: "salvo", id: "salvo" }),
    navegacao());
}

function textoCompleto() {
  const linhas = ["CADERNO DO PARQUE · minhas respostas", ""];
  let cam = 0;
  for (const s of STEPS) {
    if (s.c !== cam) { cam = s.c; linhas.push("", `## ${CAMINHADAS[cam]}`); }
    const r = respostas[s.id];
    if (s.tipo === "grade") {
      const notas = r?.notas || {};
      linhas.push("", "[Notas de 1 a 5 por lugar]");
      for (const [cid, nome] of CRITERIOS) {
        const n = notas[cid] || {};
        linhas.push(`- ${nome}: São Paulo ${n.sp ?? "-"}, Florianópolis ${n.fl ?? "-"}, Porto Alegre com viagens ${n.poa ?? "-"}`);
      }
      const pesos = (r?.pesos || []).map(p => CRITERIOS.find(c => c[0] === p)?.[1]).filter(Boolean);
      linhas.push(`- Linhas que mais pesam: ${pesos.length ? pesos.join("; ") : "não marquei"}`);
      continue;
    }
    const pergunta = s.tipo === "visual" ? `[Visualização] ${s.titulo} · o que vi e senti` : s.texto;
    linhas.push("", `P: ${pergunta}`, `R: ${r?.texto?.trim() || "(sem resposta)"}`);
  }
  return linhas.join("\n");
}

function telaFim(feitas) {
  const caixa = el("textarea", { id: "tudo", readonly: "", "aria-label": "Todas as respostas" });
  caixa.value = textoCompleto();
  const status = el("p", { class: "salvo", id: "salvo", "aria-live": "polite" });
  const copiar = el("button", { type: "button", class: "principal", text: "Copiar todas as respostas" });
  copiar.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(caixa.value); status.textContent = "Copiado. Agora cole na conversa com o Claude."; }
    catch { caixa.focus(); caixa.select(); status.textContent = "Selecionei o texto. Toque e segure para copiar."; }
  });
  return el("article", { class: "cartao fim" },
    el("span", { class: "rotulo", text: "Fim das três caminhadas" }),
    el("h2", { text: "Agora leve as respostas para a leitura" }),
    el("p", { text: `Você respondeu ${feitas} de ${STEPS.length}. Copie tudo e cole na conversa com o Claude. Ele lê e te diz para onde ir, o que você quer de fato e o que deveria querer.` }),
    el("p", { class: "dica", text: "Suas respostas ficam só neste celular. Elas não são enviadas a lugar nenhum até você copiar e colar." }),
    el("div", { class: "navegacao" }, copiar),
    status,
    caixa);
}

function renderIndice() {
  const lista = document.getElementById("lista");
  lista.replaceChildren();
  STEPS.forEach((s, i) => {
    const b = el("button", { type: "button", onclick: () => ir(i) },
      el("span", { class: "marca", text: respondida(s) ? "✓" : "·" }),
      el("span", { class: "txt", text: s.titulo || s.texto }));
    if (i === atual) b.setAttribute("aria-current", "true");
    lista.append(el("li", {}, b));
  });
  const fim = el("button", { type: "button", onclick: () => ir(STEPS.length) },
    el("span", { class: "marca", text: "→" }), el("span", { class: "txt", text: "Fim: copiar as respostas" }));
  if (atual >= STEPS.length) fim.setAttribute("aria-current", "true");
  lista.append(el("li", {}, fim));
}

/* ---------- cronômetro ---------- */
let lock = null;
function fmt(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function iniciarTimer(seg) {
  const fim = Date.now() + seg * 1000;
  const btn = document.getElementById("btn-timer");
  if (btn) btn.textContent = "Parar";
  try { navigator.wakeLock?.request("screen").then(l => { lock = l; }).catch(() => {}); } catch {}
  timerAtivo = setInterval(() => {
    const resta = Math.max(0, Math.round((fim - Date.now()) / 1000));
    const out = document.getElementById("relogio");
    if (out) out.textContent = fmt(resta);
    if (resta <= 0) { pararTimer(); bip(); const o = document.getElementById("relogio"); if (o) o.textContent = "Pronto. Abra os olhos."; }
  }, 500);
}
function pararTimer() {
  if (timerAtivo) { clearInterval(timerAtivo); timerAtivo = null; }
  try { lock?.release(); } catch {} lock = null;
  const btn = document.getElementById("btn-timer");
  if (btn) btn.textContent = "Recomeçar";
}
function bip() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.35].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 660; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.3);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.32);
    });
  } catch {}
  try { navigator.vibrate?.([300, 150, 300]); } catch {}
}

carregar();
render();
</script>
